<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Личный кабинет — RMS</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script>try{var t=localStorage.getItem("rm_theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="css/style.css?v=20260923-logo7">
</head>
<body>
  <header id="site-header"></header>

  <main class="container">
    <div class="page-title"><h1>Личный кабинет</h1></div>
    <div id="profile"></div>
    <div id="telegram"></div>

    <div class="section-head" style="margin-top:8px">
      <h2>Мои заказы</h2>
    </div>
    <div id="orders"><div class="skeleton" style="height:140px"></div></div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/app.js?v=20260923-logo7"></script>
  <script>
    const STATUS_FLOW = ["pending", "confirmed", "preparing", "ready", "completed"];
    const STATUS_LABEL = {
      pending: "Ожидает",
      confirmed: "Принят",
      preparing: "Готовится",
      ready: "Готов к выдаче",
      completed: "Выполнен",
      cancelled: "Отменён",
    };

    async function loadProfile() {
      const user = Auth.user();

      document.getElementById("profile").innerHTML = `
        <div class="profile-head">
          <div class="avatar">${esc(user.name.charAt(0).toUpperCase())}</div>
          <div class="who">
            <h2>${esc(user.name)}</h2>
            <div class="muted">${esc(user.email)}</div>
            <span class="role-badge ${user.role === "admin" ? "admin" : ""}">${esc(user.role)}</span>
          </div>
          <button class="btn btn-ghost" id="logout">Выйти</button>
        </div>`;

      document.getElementById("logout").addEventListener("click", () => {
        Auth.logout();
        location.href = "index.html";
      });

      // Проверяем токен на сервере через защищённый GET /api/profile.
      try {
        await API.get("/profile");
      } catch (error) {
        if (error.status === 401) {
          Auth.logout();
          location.href = "login.html?next=profile.html";
        }
      }
    }

    function orderCard(order) {
      const status = order.status || "pending";
      const step = STATUS_FLOW.indexOf(status);
      const items = (order.items || [])
        .map((i) => `${esc(i.name || "Блюдо #" + i.dish_id)} ×${i.quantity}`)
        .join(", ");
      const date = order.created_at ? new Date(order.created_at).toLocaleString("ru-RU") : "";

      return `
        <div class="order-card">
          <div class="order-top">
            <div>
              <strong>#${order.id}</strong>
              <span class="muted" style="margin-left:10px;font-size:14px">${date}</span>
            </div>
            <span class="status ${status}">${STATUS_LABEL[status] || esc(status)}</span>
          </div>
          <div class="order-items">${items || "—"}</div>
          ${status === "cancelled" ? "" : `
            <div class="timeline">
              ${STATUS_FLOW.map((_, i) => `<div class="${i <= step ? "done" : ""}"></div>`).join("")}
            </div>
            <div class="timeline-labels">
              ${STATUS_FLOW.map((s) => `<span>${STATUS_LABEL[s]}</span>`).join("")}
            </div>`}
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px">
            ${status === "pending" && order.id !== 1024
              ? `<button class="btn btn-danger btn-sm" data-cancel="${order.id}">Отменить заказ</button>`
              : "<span></span>"}
            <strong style="font-size:18px">${money(order.total_price ?? order.total ?? 0)}</strong>
          </div>
        </div>`;
    }

    // ---------- Telegram ----------

    let telegramPoll = null;

    async function loadTelegram() {
      const box = document.getElementById("telegram");
      let tg;
      try {
        tg = await API.get("/telegram");
      } catch {
        box.innerHTML = "";
        return;
      }
      if (!tg.enabled) {
        box.innerHTML = "";
        return;
      }
      const isStaff = ["owner", "admin"].includes(Auth.user()?.role);

      if (tg.linked) {
        clearInterval(telegramPoll);
        box.innerHTML = `
          <div class="tg-card linked">
            <div class="tg-icon" aria-hidden="true">✈️</div>
            <div class="tg-text">
              <strong>Telegram подключён${tg.username ? " · @" + esc(tg.username) : ""}</strong>
              <span>${isStaff
                ? "Сюда приходят статусы заказов и утренняя сводка. В боте можно спросить ИИ-ассистента."
                : "Статусы заказов придут в " + esc(tg.bot) + " — страницу можно не держать открытой."}</span>
            </div>
            <button class="btn btn-ghost btn-sm" id="tg-unlink">Отключить</button>
          </div>`;
        document.getElementById("tg-unlink").addEventListener("click", async () => {
          if (!confirm("Отключить уведомления в Telegram?")) return;
          await API.delete("/telegram/link").catch(() => {});
          loadTelegram();
        });
        return;
      }

      box.innerHTML = `
        <div class="tg-card">
          <div class="tg-icon" aria-hidden="true">✈️</div>
          <div class="tg-text">
            <strong>Уведомления в Telegram</strong>
            <span>«Заказ готовится», «Готов — можно забирать» — прямо в мессенджер.
              ${isStaff ? "Владельцу — ещё утренняя сводка и ИИ-ассистент." : ""}</span>
          </div>
          <button class="btn btn-sm" id="tg-link">Подключить</button>
        </div>`;

      document.getElementById("tg-link").addEventListener("click", async (e) => {
        const button = e.currentTarget;
        button.disabled = true;
        // Окно открываем сразу по клику: иначе браузер заблокирует его как всплывающее.
        const win = window.open("about:blank", "_blank");
        try {
          const link = await API.post("/telegram/link");
          if (win) win.location.href = link.url;
          else location.href = link.url;
          button.textContent = "Ждём подтверждения в Telegram…";
          // Бот привяжет аккаунт, как только пользователь нажмёт «Start».
          clearInterval(telegramPoll);
          const started = Date.now();
          telegramPoll = setInterval(async () => {
            if (Date.now() - started > link.expires_in * 1000) {
              clearInterval(telegramPoll);
              loadTelegram();
              return;
            }
            const now = await API.get("/telegram").catch(() => null);
            if (now?.linked) {
              UI.toast("Telegram подключён ✈️", "success");
              loadTelegram();
            }
          }, 3000);
        } catch (error) {
          win?.close();
          UI.toast("Не удалось создать ссылку: " + error.message, "error");
          button.disabled = false;
        }
      });
    }

    async function loadOrders() {
      const root = document.getElementById("orders");
      try {
        const orders = await API.get("/orders");
        root.innerHTML = orders.length
          ? orders.map(orderCard).join("")
          : `<div class="empty"><div class="big">🧾</div><h3>Заказов пока нет</h3>
               <a href="menu.html" class="btn">Сделать первый заказ</a></div>`;
      } catch (error) {
        root.innerHTML = API.isMissing(error)
          ? `<div class="note"><span>🧪</span><span>История заказов появится, когда будет готов
               <code>GET /api/orders</code> (RM-7). Статусы будут отображаться так:</span></div>
             ${orderCard({ id: 1024, status: "preparing", total_price: 6400, items: [{ name: "Пепперони", quantity: 2 }] })}`
          : `<div class="empty"><h3>Не удалось загрузить заказы</h3><p>${esc(error.message)}</p></div>`;
      }
    }

    // Клиент может отменить заказ, пока его не принял официант.
    document.getElementById("orders").addEventListener("click", async (e) => {
      const button = e.target.closest("[data-cancel]");
      if (!button || !confirm("Отменить заказ?")) return;
      try {
        await API.post(`/orders/${button.dataset.cancel}/cancel`);
        UI.toast("Заказ отменён", "success");
      } catch (error) {
        UI.toast(error.status === 409 ? "Заказ уже принят — отменить нельзя" : error.message, "error");
      }
      loadOrders();
    });

    // Статус обновляется сам, пока открыт кабинет.
    setInterval(() => Auth.isLoggedIn() && loadOrders(), 20000);

    if (Auth.requireLogin()) {
      initPage("profile");
      loadProfile();
      loadTelegram();
      loadOrders();
    }
  </script>
</body>
</html>
