<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Меню — RMS</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script>try{var t=localStorage.getItem("rm_theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="css/style.css?v=20260923-logo6">
</head>
<body>
  <header id="site-header"></header>

  <main class="container">
    <div class="page-title">
      <h1>Меню</h1>
      <p>Категории → блюда → корзина</p>
    </div>

    <div class="toolbar">
      <div class="chips" id="category-chips"></div>
      <label class="search">
        <input class="input" id="search" type="search" placeholder="Найти блюдо…">
      </label>
    </div>

    <div id="demo-note"></div>
    <div class="dish-grid" id="dishes">
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/app.js?v=20260923-logo6"></script>
  <script>
    initPage("menu");

    const state = {
      category: Number(qs("cat")) || 0, // 0 = все категории
      search: "",
      categories: [],
      dishes: [],
    };

    function renderChips() {
      const all = [{ id: 0, name: "Все" }, ...state.categories];
      document.getElementById("category-chips").innerHTML = all.map((c) => `
        <button class="chip ${c.id === state.category ? "active" : ""}" data-cat="${c.id}">
          ${c.id ? (CATEGORY_EMOJI[c.name] || "🍽️") + " " : ""}${esc(c.name)}
        </button>`).join("");
    }

    function renderDishes() {
      const query = state.search.trim().toLowerCase();
      const list = state.dishes.filter((d) =>
        (!state.category || d.category_id === state.category) &&
        (!query || d.name.toLowerCase().includes(query) || (d.description || "").toLowerCase().includes(query))
      );

      const grid = document.getElementById("dishes");
      grid.innerHTML = list.length
        ? list.map((d, i) => UI.dishCard(d, state.categories, i)).join("")
        : `<div class="empty" style="grid-column:1/-1">
             <div class="big">🤷</div>
             <h3>Ничего не нашлось</h3>
             <p>Попробуйте другую категорию или запрос.</p>
           </div>`;
    }

    document.getElementById("category-chips").addEventListener("click", (e) => {
      const chip = e.target.closest("[data-cat]");
      if (!chip) return;
      state.category = Number(chip.dataset.cat);
      // Сохраняем выбранную категорию в URL, чтобы ссылкой можно было поделиться.
      history.replaceState(null, "", state.category ? "?cat=" + state.category : location.pathname);
      renderChips();
      renderDishes();
    });

    document.getElementById("search").addEventListener("input", (e) => {
      state.search = e.target.value;
      renderDishes();
    });

    (async () => {
      try {
        [state.categories, state.dishes] = await Promise.all([Data.categories(), Data.dishes()]);
      } catch (error) {
        UI.toast("Не удалось загрузить меню: " + error.message, "error");
        return;
      }
      if (Data.demo) document.getElementById("demo-note").innerHTML = UI.demoNote();
      renderChips();
      renderDishes();
    })();
  </script>
</body>
</html>
