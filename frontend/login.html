<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — RMS</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>try{var t=localStorage.getItem("rm_theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="css/style.css?v=20261006-corp">
</head>
<body>
  <header id="site-header"></header>

  <main class="auth-wrap">
    <div class="auth-card">
      <h1 id="title">Вход в аккаунт</h1>
      <p id="subtitle">Войдите, чтобы оформлять заказы и следить за ними.</p>

      <div class="tabs">
        <button type="button" data-mode="login" class="active">Вход</button>
        <button type="button" data-mode="register">Регистрация</button>
      </div>

      <form id="auth-form" novalidate>
        <div class="field hidden" id="name-field">
          <label for="name">Имя</label>
          <input class="input" id="name" name="name" autocomplete="name" placeholder="Artem">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input class="input" id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="password">Пароль</label>
          <input class="input" id="password" name="password" type="password" autocomplete="current-password" placeholder="Минимум 6 символов" required>
        </div>
        <div class="form-error" id="error"></div>
        <button class="btn btn-block" type="submit" id="submit">Войти</button>
      </form>
    </div>
  </main>

  <script src="js/app.js?v=20261006-corp"></script>
  <script>
    initPage("login");

    let mode = "login";
    const form = document.getElementById("auth-form");
    const errorBox = document.getElementById("error");
    const submit = document.getElementById("submit");

    // Куда вернуть пользователя после входа (только локальные страницы).
    const next = /^[a-z-]+\.html/.test(qs("next") || "") ? qs("next") : "profile.html";

    if (Auth.isLoggedIn()) location.replace(next);

    const texts = {
      login: { title: "Вход в аккаунт", subtitle: "Войдите, чтобы оформлять заказы и следить за ними.", submit: "Войти" },
      register: { title: "Регистрация", subtitle: "Регистрация займёт полминуты.", submit: "Зарегистрироваться" },
    };

    document.querySelector(".tabs").addEventListener("click", (e) => {
      const tab = e.target.closest("[data-mode]");
      if (!tab) return;
      mode = tab.dataset.mode;
      document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("active", b === tab));
      document.getElementById("name-field").classList.toggle("hidden", mode === "login");
      document.getElementById("password").autocomplete = mode === "login" ? "current-password" : "new-password";
      document.getElementById("title").textContent = texts[mode].title;
      document.getElementById("subtitle").textContent = texts[mode].subtitle;
      submit.textContent = texts[mode].submit;
      errorBox.textContent = "";
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.textContent = "";

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      // Та же валидация, что и в Go-структурах (binding:"required,email,min=6"),
      // чтобы показать ошибку сразу, без запроса к серверу.
      if (mode === "register" && !name) return (errorBox.textContent = "Введите имя");
      if (!/^\S+@\S+\.\S+$/.test(email)) return (errorBox.textContent = "Некорректный email");
      if (password.length < 6) return (errorBox.textContent = "Пароль — минимум 6 символов");

      submit.disabled = true;
      try {
        if (mode === "register") {
          await API.post("/auth/register", { name, email, password });
        }
        const result = await API.post("/auth/login", { email, password });
        Auth.save(result.token, result.user);
        UI.toast(`Привет, ${result.user.name}!`, "success");
        location.href = next;
      } catch (error) {
        const messages = {
          "email already exists": "Такой email уже зарегистрирован",
          "invalid email or password": "Неверный email или пароль",
        };
        errorBox.textContent = messages[error.message] || error.message;
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
