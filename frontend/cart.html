<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Корзина — RMS</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>try{var t=localStorage.getItem("rm_theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="css/style.css?v=20261006-67">
</head>
<body>
  <header id="site-header"></header>

  <main class="container">
    <div class="page-title">
      <h1>Корзина</h1>
    </div>
    <div id="cart"></div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/app.js?v=20261006-67"></script>
  <script>
    initPage("cart");

    const root = document.getElementById("cart");
    // Фото берём из меню: в корзинах, собранных до появления фото, их нет.
    let photos = new Map();

    function render() {
      const items = Cart.items();

      if (!items.length) {
        root.innerHTML = `
          <div class="empty" style="margin:24px 0 60px">
            <h3>Корзина пуста</h3>
            <p>Добавьте что-нибудь вкусное из меню.</p>
            <a href="menu.html" class="btn">Перейти в меню</a>
          </div>`;
        return;
      }

      root.innerHTML = `
        <div class="cart-layout">
          <div class="cart-list">
            ${items.map((i) => `
              <div class="cart-row">
                <a class="thumb" href="dish.html?id=${i.id}">${photos.get(i.id) || i.image
                  ? `<img src="${esc(photos.get(i.id) || i.image)}" alt="${esc(i.name)}">`
                  : esc(i.name.charAt(0))}</a>
                <div>
                  <div class="name">${esc(i.name)}</div>
                  <div class="unit">${money(i.price)}</div>
                </div>
                <div class="qty">
                  <button data-id="${i.id}" data-step="-1" aria-label="Меньше">−</button>
                  <span>${i.quantity}</span>
                  <button data-id="${i.id}" data-step="1" aria-label="Больше">+</button>
                </div>
                <div class="sum">${money(i.price * i.quantity)}</div>
                <button class="icon-btn" data-remove="${i.id}" aria-label="Удалить">✕</button>
              </div>`).join("")}
          </div>

          <aside class="summary">
            <h3>Ваш заказ</h3>
            <div class="summary-line"><span>Позиций</span><span>${Cart.count()}</span></div>
            <div class="summary-line"><span>Доставка</span><span>Бесплатно</span></div>
            <div class="summary-total"><span>Итого</span><span>${money(Cart.total())}</span></div>
            <button class="btn btn-block" id="checkout">Оформить заказ</button>
            ${Auth.isLoggedIn() ? "" : '<p class="muted" style="font-size:13px;margin-top:10px;text-align:center">Для оформления нужно войти</p>'}
          </aside>
        </div>`;
    }

    root.addEventListener("click", async (e) => {
      const step = e.target.closest("[data-step]");
      if (step) {
        const id = Number(step.dataset.id);
        const item = Cart.items().find((i) => i.id === id);
        if (item) Cart.setQuantity(id, item.quantity + Number(step.dataset.step));
        render();
        return;
      }

      const remove = e.target.closest("[data-remove]");
      if (remove) {
        Cart.remove(Number(remove.dataset.remove));
        render();
        return;
      }

      if (e.target.id === "checkout") {
        await checkout(e.target);
      }
    });

    async function checkout(button) {
      if (!Auth.requireLogin()) return;

      button.disabled = true;
      button.textContent = "Оформляем…";

      // На сервер отправляем только id и количество —
      // цену бэкенд должен брать из БД, а не доверять клиенту.
      const body = {
        items: Cart.items().map((i) => ({ dish_id: i.id, quantity: i.quantity })),
      };

      try {
        const order = await API.post("/orders", body);
        Cart.clear();
        UI.toast(`Заказ #${order?.id ?? ""} оформлен!`, "success");
        // Пасхалка: сумму берём из ответа сервера, а не из корзины.
        if (Number(order?.total_price) === 67) await playSixSeven();
        setTimeout(() => (location.href = "profile.html"), 900);
      } catch (error) {
        if (API.isMissing(error)) {
          UI.toast("Orders API ещё в разработке (RM-7) — корзина сохранена", "error");
        } else {
          UI.toast("Не удалось оформить заказ: " + error.message, "error");
        }
        button.disabled = false;
        button.textContent = "Оформить заказ";
      }
    }

    // «Six seven»: 6 и 7 качаются, как руки-весы из мема. Длится ~4,5 с,
    // клик или Esc закрывают раньше. Промис разрешается, когда оверлей исчез.
    function playSixSeven() {
      return new Promise((resolve) => {
        const overlay = document.createElement("div");
        overlay.className = "six-seven";
        overlay.setAttribute("role", "status");
        overlay.innerHTML = `
          <div class="ss-stage">
            <div class="ss-nums" aria-hidden="true">
              <div class="ss-num"><span>6</span><span class="hand">🫴</span></div>
              <div class="ss-num"><span>7</span><span class="hand">🫴</span></div>
            </div>
            <div class="ss-title">six seven</div>
            <p class="ss-note">Заказ на 67 ₸ оформлен. Нажмите, чтобы продолжить</p>
          </div>`;
        document.body.appendChild(overlay);

        let done = false;
        const close = () => {
          if (done) return;
          done = true;
          document.removeEventListener("keydown", onKey);
          overlay.classList.add("out");
          setTimeout(() => { overlay.remove(); resolve(); }, 300);
        };
        const onKey = (e) => { if (e.key === "Escape" || e.key === "Enter") close(); };
        overlay.addEventListener("click", close);
        document.addEventListener("keydown", onKey);
        setTimeout(close, 4500);
      });
    }

    render();
    Data.dishes().then((dishes) => {
      photos = new Map(dishes.filter((d) => d.image_url).map((d) => [d.id, d.image_url]));
      render();
    }).catch(() => {});
  </script>
</body>
</html>
