<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Корзина — RMS</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>try{var t=localStorage.getItem("rm_theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="css/style.css?v=20261104-users">
</head>
<body>
  <header id="site-header"></header>

  <main class="container">
    <div class="page-title">
      <h1>Корзина</h1>
    </div>
    <div id="cart"></div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/app.js?v=20261104-users"></script>
  <script>
    initPage("cart");

    const root = document.getElementById("cart");
    // Фото берём из меню: в корзинах, собранных до появления фото, их нет.
    let photos = new Map();

    // ---------- Промокод ----------
    // Код запоминается, скидку же всегда считает сервер: и в предпросмотре
    // (POST /promo/check), и ещё раз при оформлении заказа.
    let promoCode = store.get("rm_promo", "");
    let promo = null;        // ответ /promo/check: { code, discount, total, description }
    let promoMessage = "";   // почему код не применился

    const PROMO_ERRORS = {
      promo_not_found: () => "Такого промокода нет",
      promo_inactive: () => "Этот промокод больше не действует",
      promo_expired: () => "Срок действия промокода истёк",
      promo_exhausted: () => "Промокод уже использовали максимальное число раз",
      promo_used: () => "Вы уже использовали этот промокод",
      promo_min_total: (data) => `Промокод действует для заказа от ${money(data?.min_total ?? 0)}`,
    };

    function promoErrorText(error) {
      const text = PROMO_ERRORS[error.message];
      return text ? text(error.data) : "Не удалось проверить промокод: " + error.message;
    }

    function setPromoCode(code) {
      promoCode = code;
      if (code) store.set("rm_promo", code); else store.remove("rm_promo");
    }

    // Пересчитать скидку для текущей корзины (после ввода кода и любых изменений корзины).
    async function refreshPromo() {
      const items = Cart.items();
      if (!promoCode || !items.length || !Auth.isLoggedIn()) {
        promo = null;
        render();
        return;
      }
      try {
        promo = await API.post("/promo/check", {
          code: promoCode,
          items: items.map((i) => ({ dish_id: i.id, quantity: i.quantity })),
        });
        promoMessage = "";
      } catch (error) {
        promo = null;
        promoMessage = promoErrorText(error);
        // Кода нет совсем — забываем его; остальные причины могут пройти (например, мин. сумма).
        if (error.message === "promo_not_found") setPromoCode("");
      }
      render();
    }

    function promoBlock() {
      if (!Auth.isLoggedIn()) {
        return `<p class="promo-msg"><a class="tg-link" href="login.html?next=cart.html">Войдите</a>, чтобы применить промокод</p>`;
      }
      if (promo) {
        return `
          <div class="promo-applied">
            <span><b>${esc(promo.code)}</b>${promo.description ? " · " + esc(promo.description) : ""}</span>
            <button class="icon-btn" id="promo-remove" aria-label="Убрать промокод">✕</button>
          </div>`;
      }
      return `
        <form class="promo-form" id="promo-form">
          <input class="input" id="promo-input" placeholder="Промокод" maxlength="32"
                 autocomplete="off" autocapitalize="characters" value="${esc(promoCode)}">
          <button class="btn btn-ghost" type="submit">Применить</button>
        </form>
        ${promoMessage ? `<p class="promo-msg error">${esc(promoMessage)}</p>` : ""}`;
    }

    function render() {
      const items = Cart.items();

      if (!items.length) {
        root.innerHTML = `
          <div class="empty" style="margin:24px 0 60px">
            <h3>Корзина пуста</h3>
            <p>Добавьте что-нибудь вкусное из меню.</p>
            <a href="menu.html" class="btn">Перейти в меню</a>
          </div>`;
        return;
      }

      root.innerHTML = `
        <div class="cart-layout">
          <div class="cart-list">
            ${items.map((i) => `
              <div class="cart-row">
                <a class="thumb" href="dish.html?id=${i.id}">${photos.get(i.id) || i.image
                  ? `<img src="${esc(photos.get(i.id) || i.image)}" alt="${esc(i.name)}">`
                  : esc(i.name.charAt(0))}</a>
                <div>
                  <div class="name">${esc(i.name)}</div>
                  <div class="unit">${money(i.price)}</div>
                </div>
                <div class="qty">
                  <button data-id="${i.id}" data-step="-1" aria-label="Меньше">−</button>
                  <span>${i.quantity}</span>
                  <button data-id="${i.id}" data-step="1" aria-label="Больше">+</button>
                </div>
                <div class="sum">${money(i.price * i.quantity)}</div>
                <button class="icon-btn" data-remove="${i.id}" aria-label="Удалить">✕</button>
              </div>`).join("")}
          </div>

          <aside class="summary">
            <h3>Ваш заказ</h3>
            <div class="summary-line"><span>Позиций</span><span>${Cart.count()}</span></div>
            ${promo ? `
              <div class="summary-line"><span>Сумма</span><span>${money(promo.subtotal)}</span></div>
              <div class="summary-line discount"><span>Скидка по промокоду</span><span>−${money(promo.discount)}</span></div>` : ""}
            <div class="summary-line"><span>Доставка</span><span>Бесплатно</span></div>
            <div class="summary-total"><span>Итого</span><span>${money(promo ? promo.total : Cart.total())}</span></div>
            <div class="promo">${promoBlock()}</div>
            <button class="btn btn-block" id="checkout">Оформить заказ</button>
            ${Auth.isLoggedIn() ? "" : '<p class="muted" style="font-size:13px;margin-top:10px;text-align:center">Для оформления нужно войти</p>'}
          </aside>
        </div>`;
    }

    root.addEventListener("click", async (e) => {
      const step = e.target.closest("[data-step]");
      if (step) {
        const id = Number(step.dataset.id);
        const item = Cart.items().find((i) => i.id === id);
        if (item) Cart.setQuantity(id, item.quantity + Number(step.dataset.step));
        render();
        refreshPromo(); // скидка зависит от суммы
        return;
      }

      const remove = e.target.closest("[data-remove]");
      if (remove) {
        Cart.remove(Number(remove.dataset.remove));
        render();
        refreshPromo();
        return;
      }

      if (e.target.closest("#promo-remove")) {
        setPromoCode("");
        promo = null;
        promoMessage = "";
        render();
        return;
      }

      if (e.target.id === "checkout") {
        await checkout(e.target);
      }
    });

    root.addEventListener("submit", async (e) => {
      if (e.target.id !== "promo-form") return;
      e.preventDefault();
      const code = document.getElementById("promo-input").value.trim().toUpperCase();
      if (!code) return;
      setPromoCode(code);
      await refreshPromo();
      if (promo) UI.toast(`Промокод ${promo.code} применён: −${money(promo.discount)}`, "success");
    });

    async function checkout(button) {
      if (!Auth.requireLogin()) return;

      button.disabled = true;
      button.textContent = "Оформляем…";

      // На сервер отправляем только id и количество —
      // цену бэкенд должен брать из БД, а не доверять клиенту.
      const body = {
        items: Cart.items().map((i) => ({ dish_id: i.id, quantity: i.quantity })),
      };
      // Код уходит только если сервер его уже принял в предпросмотре;
      // скидку сервер всё равно посчитает заново.
      if (promo) body.promo_code = promo.code;

      try {
        const order = await API.post("/orders", body);
        Cart.clear();
        setPromoCode("");
        UI.toast(`Заказ #${order?.id ?? ""} оформлен!`, "success");
        // Пасхалка: сумму берём из ответа сервера, а не из корзины.
        if (Number(order?.total_price) === 67) await playSixSeven();
        setTimeout(() => (location.href = "profile.html"), 900);
      } catch (error) {
        if (API.isMissing(error)) {
          UI.toast("Orders API ещё в разработке (RM-7) — корзина сохранена", "error");
        } else if (error.message.startsWith("promo_")) {
          // Пока гость думал, код могли выключить или исчерпать: заказ не создан,
          // показываем причину, и можно оформить без скидки.
          promo = null;
          promoMessage = promoErrorText(error);
          render();
          UI.toast("Заказ не оформлен: " + promoMessage, "error");
          return;
        } else {
          UI.toast("Не удалось оформить заказ: " + error.message, "error");
        }
        button.disabled = false;
        button.textContent = "Оформить заказ";
      }
    }

    // «Six seven»: 6 и 7 качаются, как руки-весы из мема. Длится ~4,5 с,
    // клик или Esc закрывают раньше. Промис разрешается, когда оверлей исчез.
    function playSixSeven() {
      return new Promise((resolve) => {
        const overlay = document.createElement("div");
        overlay.className = "six-seven";
        overlay.setAttribute("role", "status");
        overlay.innerHTML = `
          <div class="ss-stage">
            <div class="ss-nums" aria-hidden="true">
              <div class="ss-num"><span>6</span><span class="hand">🫴</span></div>
              <div class="ss-num"><span>7</span><span class="hand">🫴</span></div>
            </div>
            <div class="ss-title">six seven</div>
            <p class="ss-note">Заказ на 67 ₸ оформлен. Нажмите, чтобы продолжить</p>
          </div>`;
        document.body.appendChild(overlay);

        let done = false;
        const close = () => {
          if (done) return;
          done = true;
          document.removeEventListener("keydown", onKey);
          overlay.classList.add("out");
          setTimeout(() => { overlay.remove(); resolve(); }, 300);
        };
        const onKey = (e) => { if (e.key === "Escape" || e.key === "Enter") close(); };
        overlay.addEventListener("click", close);
        document.addEventListener("keydown", onKey);
        setTimeout(close, 4500);
      });
    }

    render();
    refreshPromo(); // код, введённый раньше, проверяем заново для текущей корзины
    Data.dishes().then((dishes) => {
      photos = new Map(dishes.filter((d) => d.image_url).map((d) => [d.id, d.image_url]));
      render();
    }).catch(() => {});
  </script>
</body>
</html>
