# Render Blueprint: Render → New → Blueprint → этот репозиторий.
# Секреты с sync: false Render спросит при создании — в git их нет.
services:
  - type: web
    name: rms
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL        # строка подключения из Neon
        sync: false
      - key: JWT_SECRET          # Render сам сгенерирует длинный случайный секрет
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN  # можно оставить пустым — бот просто выключится
        sync: false
      - key: DIGEST_HOUR
        value: "9"
      - key: TZ
        value: Asia/Almaty
      - key: GIN_MODE
        value: release
