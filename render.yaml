# Render Blueprint: Render → New → Blueprint → этот репозиторий.
# Секреты (sync: false) Render спросит при создании; в git их нет.
services:
  - type: web
    name: rms
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL          # строка подключения Neon (postgresql://…?sslmode=require)
        sync: false
      - key: JWT_SECRET            # Render сам придумает длинный случайный секрет
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN    # можно оставить пустым — бот просто выключится
        sync: false
      - key: ANTHROPIC_API_KEY     # можно оставить пустым — ИИ-ассистент ответит 503
        sync: false
      - key: DIGEST_HOUR
        value: "9"
      - key: TZ
        value: Asia/Almaty
      - key: GIN_MODE
        value: release
